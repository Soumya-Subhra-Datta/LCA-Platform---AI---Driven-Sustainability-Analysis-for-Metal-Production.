version: '3.8'

services:
  app:
    build: .
    container_name: lca-platform
    env_file:
      - .env.production
    volumes:
      - app-data:/app/backend/models
      - app-outputs:/app/backend/outputs
      - app-db:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lca-net

  nginx:
    image: nginx:alpine
    container_name: lca-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - lca-net

volumes:
  app-data:
  app-outputs:
  app-db:

networks:
  lca-net:
    driver: bridge
